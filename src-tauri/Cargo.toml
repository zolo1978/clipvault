[package]
name = "clipvault"
version = "0.1.0"
description = "A lightweight macOS clipboard history manager"
authors = ["ClipVault Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/zolo1978/clipvault"
homepage = "https://github.com/zolo1978/clipvault"
edition = "2021"
rust-version = "1.80"
keywords = ["clipboard", "clipboard-manager", "tauri", "macos"]
categories = ["gui", "utilities"]

[lib]
name = "clipvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3"
enigo = "0.2"
core-graphics = "0.24"
regex = "1"
zeroize = { version = "1", features = ["derive"] }
png = "0.17"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
